name: Build all platforms

# The only workflow of this repository: one trigger builds macOS (arm64 and
# Intel), Windows and Linux side by side. Packages are uploaded as workflow
# artifacts, a tag also creates a release. Nothing leaves GitHub.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6

      # GTK4, libadwaita and librsvg as prebuilt packages: no local build of
      # the C stack, which keeps the job fast and reproducible
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # the shipped toolchains are enough, updating first is slow and flaky
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gettext
            zip

      # the job defaults to the msys shell; the toolchain action sets its own
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      # only the target directory is cached: the toolchain has to link with
      # the mingw gcc, a cache of the host profiled build scripts does not match
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-gnu
          cache-targets: true
          cache-all-crates: true
          workspaces: ". -> target-mingw"

      - name: Build
        shell: msys2 {0}
        env:
          PKG_CONFIG_PATH: C:/msys64/ucrt64/lib/pkgconfig
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: 1
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: 1
          # msys pkg-config has no cross profile, the target is the host here
          PKG_CONFIG_ALLOW_CROSS: 1
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
        run: |
          # rustup installs into CARGO_HOME of the native shell, the msys shell
          # needs it on the PATH explicitly
          export PATH="/c/Users/runneradmin/.cargo/bin:$PATH"
          cargo --version && rustc --version
          # a separate target dir: the host shell builds its build scripts for
          # windows-msvc and the mingw objects must not be mixed with them
          export CARGO_TARGET_DIR=target-mingw
          cargo build --release --target x86_64-pc-windows-gnu \
            --bin lan-mouse --bin lan-mouse-cli --bin daemon
          cargo test -p lan-mouse-proto --target x86_64-pc-windows-gnu

      - name: Package
        shell: msys2 {0}
        run: |
          set -e
          prefix=/ucrt64
          out=lan-mouse-windows-x86_64
          mkdir -p $out
          cp target-mingw/x86_64-pc-windows-gnu/release/{lan-mouse,lan-mouse-cli,daemon}.exe $out/
          test -f $out/lan-mouse.exe

          # gdk-pixbuf loaders (the SVG loader draws the icons), the cache is
          # generated in place so that every path in it is relative
          loader_dir=$(dirname "$(find $prefix/lib -path '*/gdk-pixbuf*/loaders' -type d | head -1)")
          mkdir -p "$out/${loader_dir#$prefix/}/loaders"
          cp "$loader_dir"/loaders/*.dll "$out/${loader_dir#$prefix/}/loaders/"
          ( cd "$out/${loader_dir#$prefix/}/loaders" &&
            GDK_PIXBUF_MODULEDIR=. gdk-pixbuf-query-loaders > ../loaders.cache )
          cp -r $prefix/share/icons $out/share/
          mkdir -p $out/share/glib-2.0
          cp -r $prefix/share/glib-2.0/schemas $out/share/glib-2.0/schemas
          glib-compile-schemas $out/share/glib-2.0/schemas
          mkdir -p $out/etc
          cp -r $prefix/etc/fonts $out/etc/fonts

          # every DLL the programs and the loaders need, next to the exe
          queue=$(mktemp)
          seen=$(mktemp)
          find $out -name '*.exe' -o -name '*.dll' > $queue
          i=0
          while [ $i -lt "$(wc -l < $queue)" ]; do
            i=$((i + 1))
            file=$(sed -n "${i}p" $queue)
            objdump -p "$file" | sed -n 's/^ *DLL Name: //p' | tr -d '\r' | while read -r dll; do
              if ! grep -qix "$dll" $seen && [ -f "$prefix/bin/$dll" ]; then
                echo "$dll" >> $seen
                cp "$prefix/bin/$dll" $out/
                echo "$out/$dll" >> $queue
              fi
            done
          done

          # start scripts for the command line, both only pass the arguments
          # through; the package is unpacked flat, so the exe files and the
          # folders share one directory
          printf '%s\n' \
            '@echo off' \
            'rem Lan Mouse command line' \
            '"%~dp0lan-mouse-cli.exe" %*' > $out/lan-mouse-cli.cmd
          printf '%s\n' \
            'rem Lan Mouse command line' \
            '"%~dp0lan-mouse-cli.exe" %*' > $out/lan-mouse-cli.ps1
          printf '%s\n' \
            'rem Lan Mouse service in the foreground (no window)' \
            '"%~dp0daemon.exe" %*' > $out/daemon.cmd
          cp README.md README.windows.txt $out/
          ( cd $out && zip -qr ../lan-mouse-windows-x86_64.zip . )

      - uses: actions/upload-artifact@v6
        with:
          name: lan-mouse-windows-x86_64
          path: lan-mouse-windows-x86_64.zip

  # ------------------------------------------------------------------ macOS
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          brew install gtk4 libadwaita librsvg imagemagick
          brew install --cask inkscape || true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}

      - name: Build
        run: |
          cargo build --release
          cargo test -p lan-mouse-proto

      - name: Bundle
        run: |
          cargo install cargo-bundle --locked
          scripts/makeicns.sh || true
          # the package has several binaries, name the GUI one explicitly:
          # otherwise the first bin target (daemon) is bundled
          cargo bundle --release --bin lan-mouse
          ls -l "target/release/bundle/osx/Lan Mouse.app/Contents/MacOS/"
          test -x "target/release/bundle/osx/Lan Mouse.app/Contents/MacOS/lan-mouse"
          app="target/release/bundle/osx/Lan Mouse.app"
          test -x "$app/Contents/MacOS/lan-mouse"
          scripts/copy-macos-dylib.sh "$app/Contents/MacOS/lan-mouse"

      - name: Package
        run: |
          cd target/release/bundle/osx
          zip -r -q "lan-mouse-macos-${{ matrix.arch }}.zip" "Lan Mouse.app"

      - uses: actions/upload-artifact@v6
        with:
          name: lan-mouse-macos-${{ matrix.arch }}
          path: target/release/bundle/osx/lan-mouse-macos-${{ matrix.arch }}.zip

  # ------------------------------------------------------------------ Linux
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libx11-dev libxtst-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libportal-dev \
            libwayland-dev libxrandr-dev libxi-dev wayland-protocols libpkgconf-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - name: Build
        run: |
          cargo build --release
          cargo test -p lan-mouse-proto
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Translations
        run: ./tools/update-po.sh && git diff --exit-code po/
      - name: Package
        run: |
          out=lan-mouse-linux-x86_64
          mkdir -p $out
          cp target/release/lan-mouse target/release/lan-mouse-cli target/release/daemon $out
          cp README.md $out
          # launcher for GTK from Homebrew, the binary is built on ubuntu 22.04
          # and older distributions may not have a new enough libadwaita
          cat > lan-mouse <<'SH'
          #!/bin/sh
          # Lan Mouse: uses Homebrew's GTK when it is installed, otherwise the
          # system libraries (ubuntu 22.04 or newer)
          libdir=""
          for dir in /usr/local/lib /home/linuxbrew/.linuxbrew/lib "$HOME/.linuxbrew/lib"; do
            if [ -e "$dir/libadwaita-1.so.0" ]; then libdir="$dir"; break; fi
          done
          if [ -n "$libdir" ]; then
            export LD_LIBRARY_PATH="$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export XDG_DATA_DIRS="$(dirname "$libdir")/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          fi
          exec "$(dirname "$0")/lan-mouse-linux/bin/lan-mouse" "$@"
          SH
          chmod +x lan-mouse
          tar -czf $out.tar.gz lan-mouse $out
      - uses: actions/upload-artifact@v6
        with:
          name: lan-mouse-linux-x86_64
          path: lan-mouse-linux-x86_64.tar.gz

  # ---------------------------------------------------------------- Release
  # On a tag (v0.12.0) the built packages are attached to a release with notes
  # written here. Pushing main first builds and then publishes a version
  # release as well (0.12.0, the next patch of the latest tag), so that every
  # merged change can be downloaded without tagging by hand.
  release:
    name: Release
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Determine the version
        id: version
        run: |
          set -eu
          package_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag=${GITHUB_REF_NAME#v}
            kind="Release"
          else
            base=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
            if [ -z "$base" ]; then
              # first release of the repository
              tag=$package_version
            else
              # 0.12.0 -> 0.12.1
              major=$(echo "$base" | cut -d. -f1)
              minor=$(echo "$base" | cut -d. -f2)
              patch=$(echo "$base" | cut -d. -f3)
              if [ -z "$patch" ]; then
                # v1 -> v1.1
                minor=$(echo "$minor" | awk '{ print $1 + 1 }')
                tag="$major.$minor"
              else
                patch=$(echo "$patch" | awk '{ print $1 + 1 }')
                tag="$major.$minor.$patch"
              fi
            fi
            # several pushes can land on main, keep one release per version
            if git rev-parse -q --verify "refs/tags/v$tag" >/dev/null; then
              exit 0
            fi
            kind="Nightly"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        if: steps.version.outputs.tag != ''
        run: |
          set -eu
          tag=${{ steps.version.outputs.tag }}
          kind=${{ steps.version.outputs.kind }}
          previous=$(git tag -l 'v*' --sort=-v:refname | head -1)
          {
            echo "## Lan Mouse $tag"
            echo
            if [ "$kind" = "Nightly" ]; then
              echo "Built from \`main\` (\`${GITHUB_SHA:0:7}\`). The next release version is $tag;"
              echo "tag \`v$tag\` to make it permanent."
            else
              echo "Built from \`v$tag\` (\`${GITHUB_SHA:0:7}\`)."
            fi
            echo
            echo "### Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s (%h)' "$previous..HEAD"
            else
              echo "- first release"
            fi
            echo
            echo "### Downloads"
            echo
            echo "| System | Package | Notes |"
            echo "| --- | --- | --- |"
            echo "| Windows 10/11 x86_64 | \`lan-mouse-windows-x86_64.zip\` | unpack, double click \`lan-mouse.exe\`; command line: run \`lan-mouse-cli.cmd\` in that folder; all libraries are included |"
            echo "| macOS (Apple Silicon) | \`lan-mouse-macos-arm64.zip\` | open \`Lan Mouse.app\` |"
            echo "| macOS (Intel) | \`lan-mouse-macos-x86_64.zip\` | open \`Lan Mouse.app\` |"
            echo "| Linux x86_64 | \`lan-mouse-linux-x86_64.tar.gz\` | unpack, start \`./lan-mouse\`; GTK 4 and libadwaita are needed |"
            echo
            echo "### Updating"
            echo
            echo "Install the new package on **every** device that takes part: pairing between a"
            echo "device of an older version and one of this version is refused, because the"
            echo "protocol changed. The configuration and the paired devices are kept when the"
            echo "files are replaced."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=${{ steps.version.outputs.tag }}
          gh release create "v$tag" \
            lan-mouse-windows-x86_64.zip \
            lan-mouse-macos-arm64.zip \
            lan-mouse-macos-x86_64.zip \
            lan-mouse-linux-x86_64.tar.gz \
            --target "$GITHUB_SHA" \
            --title "Lan Mouse $tag" \
            --notes-file RELEASE_NOTES.md \
            ${{ steps.version.outputs.kind == 'Nightly' && '--prerelease' || '' }}
